name: selfcheck
on: [push, pull_request]

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python skillprune.py --selfcheck
      - run: pip install build && python -m build
